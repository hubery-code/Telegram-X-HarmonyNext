name: ci

# GOV-006 / QA-002 流水线。
# Runner 标签：self-hosted + macOS（装有 HarmonyOS SDK 与构建工具链）
# 门禁策略（P1-QA-001）：工具链缺失或配置不一致时必须立即失败阻断，严禁静默 skip 产生虚假绿灯。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  harmony-ci:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain gate (GOV-002 / BUILD-001)
        run: ./tools/ci/setup-check.sh

      - name: Secret scan (GOV-007 / SEC-002)
        run: ./tools/ci/secret-scan.sh

      - name: Design tokens check (INTEG-002)
        run: python3 ./tools/ci/check_design_tokens.py

      - name: Architecture guard (QA-002 / P1-QA-003)
        run: python3 ./tools/ci/check_architecture.py

      - name: Codegen verify (QA-002 / P1-QA-003)
        run: python3 ./tools/ci/check_codegen.py

      - name: Lint + typecheck (GOV-006)
        run: ./tools/ci/check.sh

      - name: Unit tests all modules (QA-002 / P1-QA-001)
        run: python3 ./tools/ci/test_all_modules.py

      - name: Build debug HAP (GOV-001)
        run: ./tools/ci/build.sh debug

      - name: Build release HAP (GOV-001)
        run: ./tools/ci/build.sh release

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: warn
